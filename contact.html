<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Contact — Daniel Gee</title>
    <meta
      name="description"
      content="Open to branding, product design, and web-application projects. Get in touch with Daniel Gee."
    />
    <link rel="canonical" href="https://example.com/contact" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Contact — Daniel Gee" />
    <meta
      property="og:description"
      content="Open to branding, product design, and web-application projects."
    />
    <meta property="og:image" content="/assets/images/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/assets/logo/logo.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/main.css" />

    <script src="/js/main.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <a class="site-header__brand" href="/" aria-label="Daniel Gee — home">
        <img src="/assets/logo/logo.svg" alt="" width="47" height="36" />
        <span class="site-header__wordmark">Daniel Gee</span>
      </a>

      <nav class="site-nav" aria-label="Primary">
        <ul role="list">
          <li><a class="nav-link" href="/">CV</a></li>
          <li><a class="nav-link" href="/portfolio">Portfolio</a></li>
          <li><a class="nav-link" href="/contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="page">
      <section class="section section--tall contact">
        <div>
          <h1 class="contact__title">Say<br />Hello</h1>

          <p class="contact__body">
            Open to branding, product design, and web-application projects.
          </p>

          <!-- PLACEHOLDER ADDRESS from the design system export.
               Swap for the real one before launch. -->
          <ul class="contact__details" role="list">
            <li><a href="mailto:hello@danielgee.studio">hello@danielgee.studio</a></li>
            <li>
              <a href="https://instagram.com/danielgee" rel="me noopener">Instagram &mdash; @danielgee</a>
            </li>
          </ul>
        </div>

        <!-- ==================================================================
             There's no server behind a static site, so this can't post
             anywhere on its own. Submitting opens the visitor's mail client
             with the message pre-filled — it works today, with no account
             or third-party service.

             To take submissions properly, point `action` at a form service
             (Formspree, Basin) or a Vercel serverless function, set
             `method="post"`, and delete the handler in main.js.
             ================================================================== -->
        <form class="contact__form" data-contact-form>
          <label class="field">
            <span class="field__label">Name</span>
            <input type="text" name="name" placeholder="Your name" autocomplete="name" required />
          </label>

          <label class="field">
            <span class="field__label">Email</span>
            <input
              type="email"
              name="email"
              placeholder="you@studio.com"
              autocomplete="email"
              required
            />
          </label>

          <label class="field">
            <span class="field__label">Message</span>
            <textarea name="message" rows="4" placeholder="Tell me about the project" required></textarea>
          </label>

          <button class="btn btn--accent" type="submit">Send</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <span>&copy; 2026 Daniel Gee</span>
      <a href="/">Back to CV</a>
    </footer>
  </body>
</html>
