<!doctype html>
<!--
  Page template — copy this to create a new page.

  Lives in docs/ so it never gets deployed (docs/ is in .vercelignore).

  Where to put the copy:
    about.html             → served at /about
    work/project-name.html → served at /work/project-name

  The .html extension is stripped automatically because vercel.json sets
  cleanUrls: true. Write internal links WITHOUT the extension.

  Paths are absolute (/css/…) so this works at any nesting depth.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>PAGE TITLE — Daniel Gee</title>
    <meta name="description" content="PAGE DESCRIPTION" />
    <link rel="canonical" href="https://example.com/PAGE-PATH" />

    <meta property="og:type" content="article" />
    <meta property="og:title" content="PAGE TITLE — Daniel Gee" />
    <meta property="og:description" content="PAGE DESCRIPTION" />
    <meta property="og:image" content="/assets/images/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/assets/logo/logo.svg" type="image/svg+xml" />

    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/main.css" />

    <script src="/js/main.js" defer></script>
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
      <a class="site-header__brand" href="/" aria-label="Daniel Gee — home">
        <img src="/assets/logo/logo.svg" alt="" width="47" height="36" />
        <span class="site-header__wordmark">Daniel Gee</span>
      </a>

      <nav class="site-nav" aria-label="Primary">
        <ul role="list">
          <li><a class="nav-link" href="/">CV</a></li>
          <li><a class="nav-link" href="/portfolio">Portfolio</a></li>
          <li><a class="nav-link" href="/contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main id="main" class="page">
      <section class="section section--tall">
        <h1 class="section-title">PAGE TITLE</h1>
      </section>
    </main>

    <footer class="site-footer">
      <span>&copy; 2026 Daniel Gee</span>
      <a href="/contact">Say hello</a>
    </footer>
  </body>
</html>
